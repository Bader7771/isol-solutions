<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">ISOL SOLUTIONS</title>
  <desc id="logoDesc">Logo for ISOL SOLUTIONS, insulation and acoustic engineering in Morocco. A bronze Moroccan arch holds layered insulation bands and acoustic arcs beside the wordmark.</desc>

  <defs>
    <clipPath id="isolArchClip">
      <path d="M18 126V64C18 42 42 24 72 8C102 24 126 42 126 64V126Z"/>
    </clipPath>
  </defs>

  <!-- Emblem: Moroccan arch with insulation layers and acoustic arcs -->
  <g transform="translate(40 45)">
    <path d="M18 126V64C18 42 42 24 72 8C102 24 126 42 126 64V126Z"
          fill="none" stroke="#A87A49" stroke-width="7" stroke-linejoin="round"/>

    <g clip-path="url(#isolArchClip)">
      <rect x="18" y="42" width="108" height="4" fill="#A87A49" opacity=".5"/>
      <rect x="18" y="60" width="108" height="4" fill="#A87A49" opacity=".6"/>
      <rect x="18" y="78" width="108" height="4" fill="#A87A49" opacity=".7"/>
      <rect x="18" y="96" width="108" height="4" fill="#A87A49" opacity=".8"/>

      <path d="M36 116A36 36 0 0 1 108 116" fill="none" stroke="#211B18" stroke-width="6" stroke-linecap="round"/>
      <path d="M46 116A26 26 0 0 1 98 116" fill="none" stroke="#211B18" stroke-width="5" stroke-linecap="round" opacity=".75"/>
      <path d="M56 116A16 16 0 0 1 88 116" fill="none" stroke="#211B18" stroke-width="4" stroke-linecap="round" opacity=".55"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(220 0)" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif">
    <text x="0" y="112" font-size="88" font-weight="600" letter-spacing="1.5" fill="#211B18">ISOL <tspan fill="#A87A49">SOLUTIONS</tspan></text>
    <path d="M2 138H86" stroke="#A87A49" stroke-width="3"/>
    <text x="0" y="170" font-family="Manrope, Arial, Helvetica, sans-serif" font-size="17" font-weight="600" letter-spacing="3.4" fill="#6B5F55">ISOLATION &amp; AMÉNAGEMENT · MAROC</text>
  </g>
</svg>
